rules:
  - id: hard-eng.python.dynamic-eval
    languages: [python]
    severity: ERROR
    message: Parse data without executing Python expressions from input.
    pattern: eval($INPUT, ...)
  - id: hard-eng.python.shell-execution
    languages: [python]
    severity: ERROR
    message: Pass arguments directly with shell=False instead of constructing shell commands.
    pattern-either:
      - pattern: subprocess.run(..., shell=True, ...)
      - pattern: subprocess.Popen(..., shell=True, ...)
  - id: hard-eng.javascript.dynamic-eval
    languages: [javascript, typescript]
    severity: ERROR
    message: Parse data without executing JavaScript expressions from input.
    pattern: eval($INPUT)
  - id: hard-eng.dart.shell-execution
    languages: [dart]
    severity: ERROR
    message: Pass arguments directly instead of sending a command string to a shell.
    pattern-either:
      - pattern: Process.run("sh", ["-c", $INPUT], ...)
      - pattern: Process.run("bash", ["-c", $INPUT], ...)
      - pattern: Process.start("sh", ["-c", $INPUT], ...)
      - pattern: Process.start("bash", ["-c", $INPUT], ...)
