<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Request</title>
<style>
:root{--text:#1d1d1f;--surface:#fff;--page:#f4f4f6;--accent:#2a5bd7}
body{margin:0;background:var(--page);font:16px/1.5 system-ui,sans-serif;color:var(--text)}
main{max-width:640px;margin:24px auto;padding:0 16px}
h1{font-size:20px;margin:0 0 12px}
.card{background:var(--surface);border-radius:12px;padding:16px}
.head{display:flex;justify-content:space-between}.more{border:0;background:none;padding:2px}.who{font-weight:600;margin:0 0 4px}
.note{font-size:12px;color:#a3a3a3;text-align:center;margin:8px 0 2px}
.expires{font-size:12px;color:#e0a100;text-align:center;margin:0 0 8px}
.actions{display:flex;justify-content:flex-end;gap:8px}
.actions button{border:0;border-radius:6px;padding:6px 12px;font-size:13px;color:#fff}
.approve{background:#2e9e44}.decline{background:#8a5a2b}
</style></head><body><main>
<h1>Requests</h1>
<section class="card" data-he-group="request">
<div class="head"><p class="who">Item 7</p><button class="more"><svg width="12" height="12" viewBox="0 0 12 12"><circle cx="6" cy="6" r="2"/></svg></button></div>
<p class="note">Detail line about this item</p>
<p class="expires">Accent line under it</p>
<div class="actions"><button class="approve">Yes</button><button class="decline">No</button></div>
</section></main></body></html>
