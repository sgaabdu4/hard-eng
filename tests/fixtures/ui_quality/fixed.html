<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Request</title>
<style>
:root{--text:#1d1d1f;--muted:#55565c;--surface:#fff;--page:#f4f4f6;--accent:#2a5bd7;--space:16px}
body{margin:0;background:var(--page);font:16px/1.5 system-ui,sans-serif;color:var(--text)}
main{max-width:640px;margin:24px auto;padding:0 var(--space)}
h1{font-size:20px;margin:0 0 12px}
.card{background:var(--surface);border-radius:12px;padding:var(--space)}
.card p{margin:0 0 8px}
.head{display:flex;justify-content:space-between;align-items:center}.more{border:0;background:none;min-width:44px;min-height:44px}.who{font-weight:600}
.when{color:var(--muted)}
.actions{display:flex;gap:8px;margin-top:var(--space)}
.actions button{min-height:44px;min-width:44px;border-radius:8px;padding:0 var(--space);font-size:16px}
.primary{background:var(--accent);color:#fff;border:0}
.secondary{background:transparent;color:var(--accent);border:1px solid var(--accent)}
</style></head><body><main>
<h1>Requests</h1>
<section class="card" data-he-group="request">
<div class="head"><p class="who">Item 7</p><button class="more" aria-label="More options"><svg width="16" height="16" viewBox="0 0 12 12"><circle cx="6" cy="6" r="2"/></svg></button></div>
<p>Detail line about this item</p>
<p class="when">Second line, muted</p>
<div class="actions"><button class="primary">Yes</button><button class="secondary">No</button></div>
</section></main></body></html>
