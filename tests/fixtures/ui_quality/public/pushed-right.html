<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Offer</title>
<style>
body{margin:0;background:#f4f4f6;font:16px/1.5 system-ui,sans-serif;color:#1d1d1f}
main{max-width:960px;margin:24px auto;padding:0 16px}
h1{font-size:20px;margin:0 0 12px}
.card{background:#fff;border-radius:12px;padding:16px}
.card p{margin:0 0 8px}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.actions button{min-height:44px;min-width:44px;border-radius:8px;padding:0 16px;font-size:16px}
.primary{background:#2a5bd7;color:#fff;border:0}
.secondary{background:transparent;color:#2a5bd7;border:1px solid #2a5bd7}
@media (min-width:1000px){.card{display:flex;justify-content:space-between;align-items:center}.card p{margin:0}.actions{margin:0}}
</style></head><body><main>
<h1>Offers</h1>
<section class="card">
<p>A short line about this offer</p>
<div class="actions"><button class="primary">Accept</button><button class="secondary">Decline</button></div>
</section></main></body></html>
