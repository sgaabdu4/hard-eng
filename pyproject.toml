[project]
name = "hard-eng"
version = "0.1.0"
description = "Repository-owned engineering gates and agent adapters"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest", "pytest-cov", "ruff", "pyrefly", "vulture", "deptry", "import-linter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.coverage.run]
source = ["hard_eng"]
branch = true

[tool.coverage.report]
fail_under = 70
show_missing = true

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "C901", "PLR0912", "PLR0915"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-branches = 12
max-statements = 50

[tool.pyrefly]
preset = "strict"
check-unannotated-defs = true
project-includes = ["hard_eng", "tests"]

[tool.deptry]
known_first_party = ["hard_eng"]

[tool.importlinter]
root_package = "hard_eng"

[[tool.importlinter.contracts]]
name = "No package import cycles"
type = "acyclic_siblings"
ancestors = ["hard_eng"]
