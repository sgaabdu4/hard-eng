[project]
name = "hard-eng"
version = "0.1.0"
description = "Repository-local engineering gates and agent integration"
requires-python = ">=3.12"
dependencies = ["pyyaml>=6.0.3"]

[dependency-groups]
dev = ["pytest>=9", "pytest-cov>=7", "types-pyyaml>=6.0.12"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = [".", ".hooks"]
omit = ["tests/*"]
branch = true

[tool.pyrefly]
preset = "strict"
check-unannotated-defs = true
search-path = [".hooks"]

[tool.deptry]
# Canonical skill submodules have their own dependency manifests and validation.
extend_exclude = ['^\.agents/skill-sources/']
# These modules are installed together in .hooks and imported by the runner.
known_first_party = ["gate_config", "reports", "project_setup", "agent_hooks", "update", "tool_setup"]
