                  metavariable: $F
                  regex: ^(get|filter|all|exclude|first|last)$
              - pattern-not-inside: $Q.only(...)
              - pattern-not-inside: $Q.defer(...)
              - pattern-not-inside: $Q.values(...)
              - pattern-not-inside: $Q.values_list(...)
              - pattern-not-inside: $Q.update(...)
              - pattern-not-inside: $Q.delete(...)
              - pattern-not-inside: $Q.exists(...)
              - pattern-not-inside: $Q.count(...)
              - pattern-not-inside: $Q.aggregate(...)
          - patterns:
              - pattern: sqlalchemy.select($M)
              - metavariable-regex:
                  metavariable: $M
                  regex: ^[A-Z][a-z]\w*$
          - patterns:
              - pattern-either:
                  - pattern: $S.get($M, ...)
                  - pattern: $S.query($M)
              - metavariable-regex:
                  metavariable: $M
                  regex: ^[A-Z][a-z]\w*$
              - metavariable-regex:
                  metavariable: $S
                  regex: (?i)^(?:[\w.]*session|(?:[\w.]*\.)?db)$
