rules:
  - id: regex-built-in-function-python
    languages: [python]
    severity: ERROR
    message: Compile this constant regex once at module level and reuse it.
    paths: &paths
      exclude:
        &excluded [
          ".agents/",
          "test/",
          "tests/",
          "__tests__/",
          "*Tests/",
          "test_*.py",
          "*_test.py",
          "conftest.py",
          "*.test.*",
          "*.spec.*",
          "*_test.dart",
          "*Tests.swift",
        ]
    patterns:
      - pattern-inside: |
          def $F(...):
            ...
      - pattern: re.$M("...", ...)
      - metavariable-regex:
          metavariable: $M
          regex: ^(compile|match|fullmatch|search|sub|subn|split|findall|finditer)$
  - id: regex-built-in-function-javascript
    languages: [javascript, typescript]
    options:
      constant_propagation: false
    severity: ERROR
    message: Build this constant regex once at module level and reuse it.
    paths: *paths
    patterns:
      - pattern-either:
          - pattern-inside: function $F(...) { ... }
          - pattern-inside: (...) => { ... }
          - pattern-inside: (...) => $X
          - pattern-inside: "$C.$M = function (...) { ... }"
          - pattern-inside: |
              $M(...) { ... }
      - pattern-either:
          - pattern: new RegExp("...")
          - pattern: new RegExp("...", "=~/^[dimsuv]*$/")
          - pattern: RegExp("...")
          - pattern: RegExp("...", "=~/^[dimsuv]*$/")
          - patterns:
              - pattern: /.../
              - pattern-not-regex: (?<![\w$)\]/])/(?:\\.|\[(?:\\.|[^\]\\\n])*\]|[^/\\\[\n])+/[a-z]*[gy]
  - id: regex-built-in-function-dart
    languages: [dart]
    severity: ERROR
    message: Build this constant regex once as a top-level or static final and reuse it.
    paths: *paths
    patterns:
      - pattern-either:
          - pattern-inside: $T $F(...) { ... }
          - pattern-inside: $F(...) { ... }
          - pattern-inside: (...) { ... }
          - pattern-inside: (...) => $X
      - pattern: RegExp("...", ...)
  - id: regex-built-in-function-swift
    languages: [swift]
    severity: ERROR
    message: Build this constant regex once as a global or static let and reuse it.
    paths: *paths
    patterns:
      - pattern-inside: |
          func $F(...) { ... }
      - pattern: 'NSRegularExpression(pattern: "...", ...)'
  - id: bool-array-python
    languages: [python]
    severity: ERROR
    message: >-
      A list of bools stores one object reference per flag. Use a bytearray(n), one byte per flag and as fast
      as a list; pack eight flags per byte only when memory matters. An int bitset rebuilds itself on every write.
    paths: *paths
    pattern-either:
      - pattern: "[False] * $N"
      - pattern: "[True] * $N"
      - pattern: "$N * [False]"
      - pattern: "$N * [True]"
  - id: bool-array-javascript
    languages: [javascript, typescript]
    severity: ERROR
    message: Use a bitset (a Uint32Array of words) instead of an array of booleans.
    paths: *paths
    pattern-either:
      - pattern: new Array($N).fill(false)
      - pattern: new Array($N).fill(true)
      - pattern: Array($N).fill(false)
      - pattern: Array($N).fill(true)
      - pattern: "Array.from({length: $N}, () => false)"
      - pattern: "Array.from({length: $N}, () => true)"
  - id: bool-array-dart
    languages: [dart]
    severity: ERROR
    message: Use a bitset (a Uint32List of words) instead of a list of bools.
    paths: *paths
    pattern-either:
      - pattern: List<bool>.filled($N, $V)
      - pattern: List.filled($N, false)
      - pattern: List.filled($N, true)
  - id: bool-array-swift
    languages: [swift]
    severity: ERROR
    message: Use a bitset (an array of UInt64 words) instead of an array of Bool.
    paths: *paths
    pattern-either:
      - pattern: "[Bool](repeating: $V, count: $N)"
      - pattern: "Array(repeating: false, count: $N)"
      - pattern: "Array(repeating: true, count: $N)"
  - id: whole-row-sql-python
    languages: [python]
    options:
      constant_propagation: false
    severity: ERROR
    message: Select only the columns this code reads instead of the whole row.
    paths: *paths
    patterns:
      - pattern-either:
          - pattern-inside: $F(...)
          - pattern-inside: $X = $E
          - pattern-inside: return $E
      - pattern: '"$SQL"'
      - metavariable-regex: &select-all
          metavariable: $SQL
          regex: (?is)^(?:(?!exists\s*\(|insert\s+into\b|create\s+(?:temp(?:orary)?\s+)?table\b).)*?\bselect\s+(?:distinct\s+)?(?:[a-z_]\w*\.)?\*\s*(?:,|from\b(?!\s*[\w.]+\s*\())
  - id: whole-row-sql
    languages: [javascript, typescript]
    options:
      constant_propagation: false
    severity: ERROR
    message: Select only the columns this code reads instead of the whole row.
    paths: *paths
    patterns:
      - pattern: '"$SQL"'
      - metavariable-regex: *select-all
  - id: whole-row-sql-swift
    languages: [swift]
    options:
      constant_propagation: false
    severity: ERROR
    message: Select only the columns this code reads instead of the whole row.
    paths: *paths
    patterns:
      - pattern: '"$SQL"'
      - metavariable-regex: *select-all
  - id: whole-row-sql-dart
    languages: [dart]
    severity: ERROR
    message: Select only the columns this code reads instead of the whole row.
    paths: *paths
    patterns:
      - pattern-regex: (?im)^(?:(?!//)[^\n'"])*(?:(?:'[^'\n]*'|"[^"\n]*")(?:(?!//)[^\n'"])*)*['"](?:(?!exists\s*\(|insert\s+into\b|create\s+(?:temp(?:orary)?\s+)?table\b)[^'"\n])*?\bselect\s+(?:distinct\s+)?(?:[a-z_]\w*\.)?\*\s*(?:,|from\b(?!\s*[\w.]+\s*\())
      - pattern-not-regex: (?s)/\*.*?\*/
  - id: whole-row-sql-file
    languages: [generic]
    severity: ERROR
    message: Select only the columns this code reads instead of the whole row.
    paths:
      include: ["*.sql"]
      exclude: *excluded
    patterns:
      - pattern-regex: (?im)^(?:(?!exists\s*\(|insert\s+into\b|create\s+(?:temp(?:orary)?\s+)?table\b)(?:[^'\n-]|'[^'\n]*'|-(?!-)))*?\bselect\s+(?:distinct\s+)?(?:[a-z_]\w*\.)?\*\s*(?:,|from\b(?!\s*[\w.]+\s*\())
      - pattern-not-regex: (?is)(?:exists\s*\(|insert\s+into\b[^;]*?|create\s+(?:temp(?:orary)?\s+)?table\b[^;]*?\bas\b[^;]*?)\s*select\s+(?:distinct\s+)?(?:[a-z_]\w*\.)?\*\s*(?:,|from\b(?!\s*[\w.]+\s*\())
      - pattern-not-regex: (?s)/\*.*?\*/
  - id: whole-row-query-javascript
    languages: [javascript, typescript]
    severity: ERROR
    message: Select only the columns this code reads instead of the whole row.
    paths: *paths
    pattern-either:
      - pattern: $DB.from($T).select()
      - pattern: $DB.from($T).select("*", ...)
      - pattern: $DB.select().from($T)
      - patterns:
          - pattern-either:
              - pattern: "$P.$M.$F({...})"
              - pattern: $P.$M.$F()
          - metavariable-regex:
              metavariable: $F
              regex: ^(findMany|findFirst|findFirstOrThrow|findUnique|findUniqueOrThrow)$
          - pattern-not: "$P.$M.$F({..., select: $S, ...})"
          - pattern-not: "$P.$M.$F({..., omit: $S, ...})"
          - pattern-not: "$P.$M.$F({..., columns: $S, ...})"
  - id: in-process-cache-python
    languages: [python]
    severity: ERROR
    message: Remove this cache and make the underlying work fast instead.
    paths: *paths
    pattern-either:
      - pattern: functools.cache
      - pattern: functools.lru_cache
      - pattern: functools.cached_property
      - pattern: import cachetools
      - pattern: from cachetools import $X
  - id: in-process-cache-javascript
    languages: [javascript, typescript]
    severity: ERROR
    message: Remove this cache and make the underlying work fast instead.
    paths: *paths
    patterns:
      - pattern-either:
          - pattern: import $X from "$MOD"
          - pattern: import { $X } from "$MOD"
          - pattern: import * as $X from "$MOD"
          - pattern: require("$MOD")
      - metavariable-regex:
          metavariable: $MOD
          regex: ^(lru-cache|quick-lru|memoize-one|mem|p-memoize|node-cache|memoizee|lodash/memoize|lodash\.memoize|fast-memoize|micro-memoize)$
  - id: in-process-cache-dart
    languages: [dart]
    severity: ERROR
    message: Remove this cache and make the underlying work fast instead.
    paths: *paths
    pattern-either:
      - pattern: AsyncCache(...)
      - pattern: AsyncCache<$T>(...)
      - pattern: AsyncCache.ephemeral(...)
      - pattern: AsyncMemoizer(...)
      - pattern: AsyncMemoizer<$T>(...)
  - id: in-process-cache-swift
    languages: [swift]
    severity: ERROR
    message: Remove this cache and make the underlying work fast instead.
    paths: *paths
    pattern-either:
      - pattern: NSCache<$K, $V>()
      - pattern: NSCache()
  - id: await-in-loop-python
    languages: [python]
    severity: ERROR
    message: >-
      Each loop pass waits for the last one. Start independent calls together with asyncio.gather or a TaskGroup.
      A loop passes when it stops early (break or return), reads a value it updates in its condition, or sleeps on purpose.
    paths: *paths
    patterns:
      - pattern-either:
          - pattern-inside: |
              for $X in $Y:
                ...
          - pattern-inside: |
              while $C:
                ...
          - pattern-inside: "[...]"
      - pattern: await $E
      - pattern-not-inside: |
          async for $X in $Y:
            ...
      - pattern-not-inside: |
          while True:
            ...
      - pattern-not-inside: |
          for $X in $Y:
            ...
            break
      - pattern-not-inside: |
          for $X in $Y:
            ...
            return $R
      - pattern-not-inside: |
          for $X in $Y:
            ...
            return
      - pattern-not-inside: |
          for $X in $Y:
            ...
            await asyncio.sleep(...)
      - pattern-not-inside: |
          while $C:
            ...
            break
      - pattern-not-inside: |
          while $C:
            ...
            return $R
      - pattern-not-inside: |
          while $C:
            ...
            return
      - pattern-not-inside: |
          while $C:
            ...
            await asyncio.sleep(...)
      - pattern-not-inside: |
          while <... $V ...>:
            ...
            $V = $X
  - id: await-in-loop-javascript
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      Each loop pass waits for the last one. Start independent calls together with Promise.all.
      A loop passes when it stops early (break or return), reads a value it updates in its condition, or sleeps on purpose.
    paths: *paths
    patterns:
      - pattern-either:
          - pattern-inside: for ($I of $C) { ... }
          - pattern-inside: for ($I in $C) { ... }
          - pattern-inside: for (...; ...; ...) { ... }
          - pattern-inside: while ($C) { ... }
          - pattern-inside: do { ... } while ($C)
      - pattern-either:
          - patterns:
              - pattern: await $E
              - pattern-not: await Promise.all(...)
          - patterns:
              - pattern: await $E
              - pattern: await Promise.all(...)
              - pattern-not-inside: for (...; ...; $I += $S) { ... }
      - pattern-not-inside: "for (...) { ... <... async (...) => <... await $E ...> ...>; ... }"
      - pattern-not-inside: "for (...) { ... <... async (...) => { ... <... await $E ...>; ... } ...>; ... }"
      - pattern-not-inside: "for (...) { ... <... async function (...) { ... <... await $E ...>; ... } ...>; ... }"
      - pattern-not-inside: "while ($C) { ... <... async (...) => <... await $E ...> ...>; ... }"
      - pattern-not-inside: "while ($C) { ... <... async (...) => { ... <... await $E ...>; ... } ...>; ... }"
      - pattern-not-inside: "while ($C) { ... <... async function (...) { ... <... await $E ...>; ... } ...>; ... }"
      - pattern-not-regex: (?ms)^([ \t]*)for\s+await\s*\((?:[^;{]*?\{[ \t]*\n.*?^\1\}[ \t]*$|[^\n]*$)
      - pattern-not-inside: while (true) { ... }
      - pattern-not-inside: for (...) { ... break; }
      - pattern-not-inside: for (...) { ... return $R; }
      - pattern-not-inside: for (...) { ... return; }
      - pattern-not-inside: if (<... await $E ...>) { ... throw $T; }
      - pattern-not-inside: if (<... await $E ...>) throw $T;
      - pattern-not-inside: for (...) { ... await sleep(...); }
      - pattern-not-inside: for (...) { ... await delay(...); }
      - pattern-not-inside: for (...) { ... await setTimeout(...); }
      - pattern-not-inside: while ($C) { ... break; }
      - pattern-not-inside: while ($C) { ... return $R; }
      - pattern-not-inside: while ($C) { ... return; }
      - pattern-not-inside: while ($C) { ... await sleep(...); }
      - pattern-not-inside: while ($C) { ... await delay(...); }
      - pattern-not-inside: while ($C) { ... await setTimeout(...); }
      - pattern-not-inside: do { ... break; } while ($C)
      - pattern-not-inside: do { ... return $R; } while ($C)
      - pattern-not-inside: do { ... return; } while ($C)
      - pattern-not-inside: while (<... $V ...>) { ... $V = $X; ... }
      - pattern-not-inside: do { ... $V = $X; ... } while (<... $V ...>)
      - pattern-not-inside: "async function inOrder($ITEMS, $STEP, { reason }) { ... }"
      - pattern-not-inside: "async function inOrderSteps($STEPS, { reason }) { ... }"
      - pattern-not-inside: "async function inOrder<$T>($ITEMS: Iterable<$T>, $STEP: ($ITEM: $T) => Promise<void>, { reason }: { reason: string }): Promise<void> { ... }"
      - pattern-not-inside: "async function inOrderSteps($STEPS: (() => Promise<void>)[], { reason }: { reason: string }): Promise<void> { ... }"
  - id: await-in-loop-dart
    languages: [dart]
    severity: ERROR
    message: >-
      Each loop pass waits for the last one. Start independent calls together with Future.wait.
      A loop passes when it stops early (break or return), reads a value it updates in its condition, or sleeps on purpose.
    paths: *paths
    patterns:
      - pattern-either:
          - pattern-inside: for ($I in $C) { ... }
          - pattern-inside: for (...; ...; ...) { ... }
          - pattern-inside: while ($C) { ... }
          - pattern-inside: do { ... } while ($C);
      - pattern-either:
          - patterns:
              - pattern: await $E
              - pattern-not: await Future.wait(...)
          - patterns:
              - pattern: await $E
              - pattern: await Future.wait(...)
              - pattern-not-inside: for (...; ...; $I += $S) { ... }
      - pattern-not-inside: "for ($I in $C) { ... <... (...) async => <... await $E ...> ...>; ... }"
      - pattern-not-inside: "for ($I in $C) { ... <... (...) async { ... <... await $E ...>; ... } ...>; ... }"
      - pattern-not-inside: "for (...; ...; ...) { ... <... (...) async => <... await $E ...> ...>; ... }"
      - pattern-not-inside: "for (...; ...; ...) { ... <... (...) async { ... <... await $E ...>; ... } ...>; ... }"
      - pattern-not-inside: "while ($C) { ... <... (...) async => <... await $E ...> ...>; ... }"
      - pattern-not-inside: "while ($C) { ... <... (...) async { ... <... await $E ...>; ... } ...>; ... }"
      - pattern-not-regex: (?ms)^([ \t]*)await\s+for\s*\((?:[^;{]*?\{[ \t]*\n.*?^\1\}[ \t]*$|[^\n]*$)
      - pattern-not-inside: while (true) { ... }
      - pattern-not-inside: for ($I in $C) { ... break; }
      - pattern-not-inside: for ($I in $C) { ... return; }
      - pattern-not-inside: for ($I in $C) { ... return $R; }
      - pattern-not-inside: if (<... await $E ...>) { ... throw $T; }
      - pattern-not-inside: if (<... await $E ...>) throw $T;
      - pattern-not-inside: for ($I in $C) { ... await Future.delayed(...); }
      - pattern-not-inside: for (...; ...; ...) { ... break; }
      - pattern-not-inside: for (...; ...; ...) { ... return; }
      - pattern-not-inside: for (...; ...; ...) { ... return $R; }
      - pattern-not-inside: for (...; ...; ...) { ... await Future.delayed(...); }
      - pattern-not-inside: while ($C) { ... break; }
      - pattern-not-inside: while ($C) { ... return; }
      - pattern-not-inside: while ($C) { ... return $R; }
      - pattern-not-inside: while ($C) { ... await Future.delayed(...); }
      - pattern-not-inside: do { ... break; } while ($C);
      - pattern-not-inside: do { ... return; } while ($C);
      - pattern-not-inside: do { ... return $R; } while ($C);
      - pattern-not-inside: while (<... $V ...>) { ... $V = $X; ... }
      - pattern-not-inside: do { ... $V = $X; ... } while (<... $V ...>);
      - pattern-not-inside: $V = await $F(..., <... $V ...>, ...);
      - pattern-not-inside: "Future<void> inOrder<T>(Iterable<T> $ITEMS, Future<void> Function(T $ITEM) $STEP, {required String reason}) async { ... }"
      - pattern-not-inside: "Future<void> inOrderSteps(List<Future<void> Function()> $STEPS, {required String reason}) async { ... }"
  - id: await-in-loop-swift
    languages: [swift]
    severity: ERROR
    message: >-
      Each loop pass waits for the last one. Start independent calls together with async let or a task group.
      A loop passes when it stops early (break or return), reads a value it updates in its condition, or sleeps on purpose.
    paths: *paths
    patterns:
      - pattern-either:
          - pattern-inside: for $I in $C { ... }
          - pattern-inside: while $C { ... }
          - pattern-inside: repeat { ... } while $C
      - pattern: await $E
      - pattern-not-regex: (?ms)^([ \t]*)for\s+(?:try\s+)?await\b(?:[^;{]*?\{[ \t]*\n.*?^\1\}[ \t]*$|[^\n]*$)
      - pattern-not-inside: while true { ... }
      - pattern-not-inside: |
          for $I in $C {
            ...
            break
          }
      - pattern-not-inside: |
          for $I in $C {
            ...
            return $R
          }
      - pattern-not-inside: |
          for $I in $C {
            ...
            return
          }
      - pattern-not-inside: |
          for $I in $C {
            ...
            try await Task.sleep(...)
          }
      - pattern-not-inside: |
          while $C {
            ...
            break
          }
      - pattern-not-inside: |
          while $C {
            ...
            return $R
          }
      - pattern-not-inside: |
          while $C {
            ...
            return
          }
      - pattern-not-inside: |
          while $C {
            ...
            try await Task.sleep(...)
          }
      - pattern-not-inside: |
          while $C {
            ...
            $V = $X
          }
      - pattern-not-inside: |
          repeat {
            ...
            $V = $X
          } while $C
  - id: sequential-awaits-javascript
    languages: [javascript, typescript]
    severity: ERROR
    message: The second call does not use the first result. Start both together with Promise.all.
    paths: *paths
    patterns:
      - pattern-not-inside: "inOrder(..., async (...) => { ... }, ...)"
      - pattern-not-inside: "inOrder(..., async function (...) { ... }, ...)"
      - pattern-not-inside: "inOrderSteps([..., async (...) => { ... }, ...], ...)"
      - pattern-not-inside: "inOrderSteps([..., async function (...) { ... }, ...], ...)"
      - pattern-either:
          - patterns:
              - pattern-either:
                  - pattern: |
                      const $A = await $X;
                      const $B = await $Y;
                  - pattern: |
                      let $A = await $X;
                      let $B = await $Y;
              - pattern-not: |
                  const $A = await $S.$M(...);
                  const $B = await $S.$N(...);
              - pattern-not: |
                  let $A = await $S.$M(...);
                  let $B = await $S.$N(...);
          - patterns:
              - pattern-either:
                  - pattern: |
                      const $A = await $S.$M(...);
                      const $B = await $S.$N(...);
                  - pattern: |
                      let $A = await $S.$M(...);
                      let $B = await $S.$N(...);
              - metavariable-regex:
                  metavariable: $S
                  regex: ^(?!.*(?:^|[._]|(?<=[a-z])(?=[A-Z]))(?i:session|connection|conn|transaction|cursor|readline|reader|writer|socket|dialog|lock|mutex|queue|channel|tx|trx|rl|ws|page)(?![a-z]))
      - pattern-not: |
          const $A = await $X;
          const $B = await <... $A ...>;
      - pattern-not: |
          const $A = await $X;
          const $B = await <... (...) => <... $A ...> ...>;
      - pattern-not: |
          const $A = await $X;
          const $B = await <... (...) => { ... <... $A ...>; ... } ...>;
      - pattern-not: |
          const $A = await $X;
          const $B = await <... function (...) { ... <... $A ...>; ... } ...>;
      - pattern-not: |
          let $A = await $X;
          let $B = await <... $A ...>;
      - pattern-not: |
          let $A = await $X;
          let $B = await <... (...) => <... $A ...> ...>;
      - pattern-not: |
          let $A = await $X;
          let $B = await <... (...) => { ... <... $A ...>; ... } ...>;
      - pattern-not: |
          let $A = await $X;
          let $B = await <... function (...) { ... <... $A ...>; ... } ...>;
  - id: sequential-awaits-python
    languages: [python]
    severity: ERROR
    message: The second call does not use the first result. Start both together with asyncio.gather.
    paths: *paths
    patterns:
      - pattern-either:
          - patterns:
              - pattern: |
                  $A = await $X
                  $B = await $Y
              - pattern-not: |
                  $A = await $S.$M(...)
                  $B = await $S.$N(...)
          - patterns:
              - pattern: |
                  $A = await $S.$M(...)
                  $B = await $S.$N(...)
              - metavariable-regex:
                  metavariable: $S
                  regex: ^(?!.*(?:^|[._]|(?<=[a-z])(?=[A-Z]))(?i:session|connection|conn|transaction|cursor|readline|reader|writer|socket|dialog|lock|mutex|queue|channel|tx|trx|rl|ws|page)(?![a-z]))
      - pattern-not: |
          $A = await $X
          $B = await <... $A ...>
  - id: sequential-awaits-dart
    languages: [dart]
    severity: ERROR
    message: The second call does not use the first result. Start both together with Future.wait or a record's .wait.
    paths: *paths
    patterns:
      - pattern-not-inside: "inOrder(..., (...) async { ... }, ...)"
      - pattern-not-inside: "inOrderSteps([..., (...) async { ... }, ...], ...)"
      - pattern-regex: '(?m)^[ \t]*(?:final|var|[A-Z]\w*(?:<[^=;\n]*>)?\??)\s+(\w+)\s*=\s*await\s+(?>((?:[a-z]\w*?(?=[A-Z])|\w*_)?(?i:session|connection|conn|transaction|cursor|readline|reader|writer|socket|dialog|lock|mutex|queue|channel|tx|trx|rl|ws|page)(?![a-z])\w*)\b|\w+)(?:[^;(){}\[\]]|(?<g>\((?:[^()]|(?&g))*+\)|\{(?:[^{}]|(?&g))*+\}|\[(?:[^\[\]]|(?&g))*+\]))*+;[ \t]*\n[ \t]*(?:final|var|[A-Z]\w*(?:<[^=;\n]*>)?\??)\s+\w+\s*=\s*await\s+(?!\2\b)(?:(?!\b\1\b)[^;(){}\[\]]|(?<h>\((?:(?!\b\1\b)[^()]|(?&h))*+\)|\{(?:(?!\b\1\b)[^{}]|(?&h))*+\}|\[(?:(?!\b\1\b)[^\[\]]|(?&h))*+\]))*+;'
  - id: in-order-needs-reason-dart
    languages: [dart]
    options:
