  - id: json-column
    languages: [generic]
    severity: ERROR
    message: A JSON column, or a read of one key from it. Store each key as a real column, or a list as a child table.
    paths:
      include: ["*.sql", "*.prisma"]
      exclude: *excluded
    patterns:
      - pattern-regex: (?im)^(?:[^'"\n/-]|'[^'\n]*'|"[^"\n]*"|-(?!-)|/(?!/))*?(?:(?<!::)\bjsonb?\b|->>|#>>)
      - pattern-not-regex: (?s)/\*.*?\*/
  - id: json-column-python
    languages: [python]
    options:
      constant_propagation: false
    severity: ERROR
    message: A JSON column, or a read of one key from it. Store each key as a real column, or a list as a child table.
    paths: *paths
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: JSONField(...)
              - pattern: $M.JSONField(...)
          - pattern-not: serializers.JSONField(...)
          - pattern-not: forms.JSONField(...)
          - pattern-not: rest_framework.serializers.JSONField(...)
          - pattern-not: django.forms.JSONField(...)
      - pattern: sqlalchemy.JSON
      - pattern: sqlalchemy.dialects.postgresql.JSONB
      - patterns:
          - pattern-either:
              - pattern-inside: $F(...)
              - pattern-inside: $X = $E
              - pattern-inside: return $E
          - pattern: '"$SQL"'
          - metavariable-regex: &json-read
              metavariable: $SQL
              regex: (?is)^.*?(?:\bjsonb\b|->>|#>>)
