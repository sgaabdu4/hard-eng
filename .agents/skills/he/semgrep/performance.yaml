rules:
  - id: regex-built-in-function-python
    languages: [python]
    severity: ERROR
    message: Compile this constant regex once at module level and reuse it.
    paths: &paths
      exclude:
        [
          ".agents/",
          "test/",
          "tests/",
          "__tests__/",
          "*Tests/",
          "test_*.py",
          "*_test.py",
          "conftest.py",
          "*.test.*",
          "*.spec.*",
          "*_test.dart",
          "*Tests.swift",
        ]
    patterns:
      - pattern-inside: |
          def $F(...):
            ...
      - pattern: re.$M("...", ...)
      - metavariable-regex:
          metavariable: $M
          regex: ^(compile|match|fullmatch|search|sub|subn|split|findall|finditer)$
  - id: regex-built-in-function-javascript
    languages: [javascript, typescript]
    options:
      constant_propagation: false
    severity: ERROR
    message: Build this constant regex once at module level and reuse it.
    paths: *paths
    patterns:
      - pattern-either:
          - pattern-inside: function $F(...) { ... }
          - pattern-inside: (...) => { ... }
          - pattern-inside: (...) => $X
          - pattern-inside: "$C.$M = function (...) { ... }"
          - pattern-inside: |
              $M(...) { ... }
      - pattern-either:
          - pattern: new RegExp("...")
          - pattern: new RegExp("...", "=~/^[dimsuv]*$/")
          - pattern: RegExp("...")
          - pattern: RegExp("...", "=~/^[dimsuv]*$/")
          - patterns:
              - pattern: /.../
              - pattern-not-regex: (?<![\w$)\]/])/(?:\\.|\[(?:\\.|[^\]\\\n])*\]|[^/\\\[\n])+/[a-z]*[gy]
  - id: regex-built-in-function-dart
    languages: [dart]
    severity: ERROR
    message: Build this constant regex once as a top-level or static final and reuse it.
    paths: *paths
    patterns:
      - pattern-either:
          - pattern-inside: $T $F(...) { ... }
          - pattern-inside: $F(...) { ... }
          - pattern-inside: (...) { ... }
          - pattern-inside: (...) => $X
      - pattern: RegExp("...", ...)
  - id: regex-built-in-function-swift
    languages: [swift]
    severity: ERROR
    message: Build this constant regex once as a global or static let and reuse it.
    paths: *paths
    patterns:
      - pattern-inside: |
          func $F(...) { ... }
      - pattern: 'NSRegularExpression(pattern: "...", ...)'
  - id: bool-array-python
    languages: [python]
    severity: ERROR
    message: >-
      A list of bools stores one object reference per flag. Use a bytearray(n), one byte per flag and as fast
      as a list; pack eight flags per byte only when memory matters. An int bitset rebuilds itself on every write.
    paths: *paths
    pattern-either:
      - pattern: "[False] * $N"
      - pattern: "[True] * $N"
      - pattern: "$N * [False]"
      - pattern: "$N * [True]"
  - id: bool-array-javascript
    languages: [javascript, typescript]
    severity: ERROR
    message: Use a bitset (a Uint32Array of words) instead of an array of booleans.
    paths: *paths
    pattern-either:
      - pattern: new Array($N).fill(false)
      - pattern: new Array($N).fill(true)
      - pattern: Array($N).fill(false)
      - pattern: Array($N).fill(true)
      - pattern: "Array.from({length: $N}, () => false)"
      - pattern: "Array.from({length: $N}, () => true)"
  - id: bool-array-dart
    languages: [dart]
    severity: ERROR
    message: Use a bitset (a Uint32List of words) instead of a list of bools.
    paths: *paths
    pattern-either:
      - pattern: List<bool>.filled($N, $V)
      - pattern: List.filled($N, false)
      - pattern: List.filled($N, true)
  - id: bool-array-swift
    languages: [swift]
    severity: ERROR
    message: Use a bitset (an array of UInt64 words) instead of an array of Bool.
    paths: *paths
    pattern-either:
      - pattern: "[Bool](repeating: $V, count: $N)"
      - pattern: "Array(repeating: false, count: $N)"
      - pattern: "Array(repeating: true, count: $N)"
  - id: whole-row-sql-python
    languages: [python]
    options:
      constant_propagation: false
    severity: ERROR
    message: Select only the columns this code reads instead of the whole row.
    paths: *paths
    patterns:
      - pattern-either:
          - pattern-inside: $F(...)
          - pattern-inside: $X = $E
          - pattern-inside: return $E
      - pattern: '"$SQL"'
      - metavariable-regex: &select-all
          metavariable: $SQL
          regex: (?is)^(?:(?!exists\s*\(|insert\s+into\b).)*?\bselect\s+(?:distinct\s+)?(?:[a-z_]\w*\.)?\*\s*(?:,|from\b)
  - id: whole-row-sql
    languages: [javascript, typescript]
    options:
      constant_propagation: false
    severity: ERROR
    message: Select only the columns this code reads instead of the whole row.
    paths: *paths
    patterns:
      - pattern: '"$SQL"'
      - metavariable-regex: *select-all
  - id: whole-row-sql-swift
    languages: [swift]
    options:
      constant_propagation: false
    severity: ERROR
    message: Select only the columns this code reads instead of the whole row.
    paths: *paths
    patterns:
      - pattern: '"$SQL"'
      - metavariable-regex: *select-all
  - id: whole-row-sql-dart
    languages: [dart]
    severity: ERROR
    message: Select only the columns this code reads instead of the whole row.
    paths: *paths
    patterns:
      - pattern-regex: (?im)^(?:(?!//)[^\n'"])*(?:(?:'[^'\n]*'|"[^"\n]*")(?:(?!//)[^\n'"])*)*['"](?:(?!exists\s*\(|insert\s+into\b)[^'"\n])*?\bselect\s+(?:distinct\s+)?(?:[a-z_]\w*\.)?\*\s*(?:,|from\b)
      - pattern-not-regex: (?s)/\*.*?\*/
  - id: whole-row-sql-file
    languages: [generic]
    severity: ERROR
    message: Select only the columns this code reads instead of the whole row.
    paths:
      include: ["*.sql"]
    patterns:
      - pattern-regex: (?im)^(?:(?!exists\s*\(|insert\s+into\b)(?:[^'\n-]|'[^'\n]*'|-(?!-)))*?\bselect\s+(?:distinct\s+)?(?:[a-z_]\w*\.)?\*\s*(?:,|from\b)
      - pattern-not-regex: (?is)(?:exists\s*\(|insert\s+into\b[^;]*?)\s*select\s+(?:distinct\s+)?(?:[a-z_]\w*\.)?\*\s*(?:,|from\b)
      - pattern-not-regex: (?s)/\*.*?\*/
  - id: whole-row-query-javascript
    languages: [javascript, typescript]
    severity: ERROR
    message: Select only the columns this code reads instead of the whole row.
    paths: *paths
    pattern-either:
      - pattern: $DB.from($T).select()
      - pattern: $DB.from($T).select("*", ...)
      - pattern: $DB.select().from($T)
      - patterns:
          - pattern-either:
              - pattern: "$P.$M.$F({...})"
              - pattern: $P.$M.$F()
          - metavariable-regex:
              metavariable: $F
              regex: ^(findMany|findFirst|findFirstOrThrow|findUnique|findUniqueOrThrow)$
          - pattern-not: "$P.$M.$F({..., select: $S, ...})"
          - pattern-not: "$P.$M.$F({..., omit: $S, ...})"
          - pattern-not: "$P.$M.$F({..., columns: $S, ...})"
  - id: in-process-cache-python
    languages: [python]
    severity: ERROR
    message: Remove this cache and make the underlying work fast instead.
    paths: *paths
    pattern-either:
      - pattern: functools.cache
      - pattern: functools.lru_cache
      - pattern: functools.cached_property
      - pattern: import cachetools
      - pattern: from cachetools import $X
  - id: in-process-cache-javascript
    languages: [javascript, typescript]
    severity: ERROR
    message: Remove this cache and make the underlying work fast instead.
    paths: *paths
    patterns:
      - pattern-either:
          - pattern: import $X from "$MOD"
          - pattern: import { $X } from "$MOD"
          - pattern: import * as $X from "$MOD"
          - pattern: require("$MOD")
      - metavariable-regex:
          metavariable: $MOD
          regex: ^(lru-cache|quick-lru|memoize-one|mem|p-memoize|node-cache|memoizee|lodash/memoize|lodash\.memoize|fast-memoize|micro-memoize)$
  - id: in-process-cache-dart
    languages: [dart]
    severity: ERROR
    message: Remove this cache and make the underlying work fast instead.
    paths: *paths
    pattern-either:
      - pattern: AsyncCache(...)
      - pattern: AsyncCache<$T>(...)
      - pattern: AsyncCache.ephemeral(...)
      - pattern: AsyncMemoizer(...)
      - pattern: AsyncMemoizer<$T>(...)
  - id: in-process-cache-swift
    languages: [swift]
    severity: ERROR
    message: Remove this cache and make the underlying work fast instead.
    paths: *paths
    pattern-either:
      - pattern: NSCache<$K, $V>()
      - pattern: NSCache()
  - id: await-in-loop-python
    languages: [python]
    severity: ERROR
    message: >-
      Each loop pass waits for the last one. Start independent calls together with asyncio.gather or a TaskGroup.
      A loop passes when it stops early (break or return), reads a value it updates in its condition, or sleeps on purpose.
    paths: *paths
    patterns:
      - pattern-either:
          - pattern-inside: |
              for $X in $Y:
                ...
          - pattern-inside: |
              while $C:
                ...
          - pattern-inside: "[...]"
      - pattern: await $E
      - pattern-not-inside: |
          for $X in $Y:
            ...
            break
      - pattern-not-inside: |
          for $X in $Y:
            ...
            return $R
      - pattern-not-inside: |
          for $X in $Y:
            ...
            return
      - pattern-not-inside: |
          for $X in $Y:
            ...
            await asyncio.sleep(...)
      - pattern-not-inside: |
          while $C:
            ...
            break
      - pattern-not-inside: |
          while $C:
            ...
            return $R
      - pattern-not-inside: |
          while $C:
            ...
            return
      - pattern-not-inside: |
          while $C:
            ...
            await asyncio.sleep(...)
      - pattern-not-inside: |
          while <... $V ...>:
            ...
            $V = $X
  - id: await-in-loop-javascript
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      Each loop pass waits for the last one. Start independent calls together with Promise.all.
      A loop passes when it stops early (break or return), reads a value it updates in its condition, or sleeps on purpose.
    paths: *paths
    patterns:
      - pattern-either:
          - pattern-inside: for ($I of $C) { ... }
          - pattern-inside: for ($I in $C) { ... }
          - pattern-inside: for (...; ...; ...) { ... }
          - pattern-inside: while ($C) { ... }
          - pattern-inside: do { ... } while ($C)
      - pattern: await $E
      - pattern-not-inside: for (...) { ... break; }
      - pattern-not-inside: for (...) { ... return $R; }
      - pattern-not-inside: for (...) { ... return; }
      - pattern-not-inside: for (...) { ... await sleep(...); }
      - pattern-not-inside: for (...) { ... await delay(...); }
      - pattern-not-inside: for (...) { ... await setTimeout(...); }
      - pattern-not-inside: while ($C) { ... break; }
      - pattern-not-inside: while ($C) { ... return $R; }
      - pattern-not-inside: while ($C) { ... return; }
      - pattern-not-inside: while ($C) { ... await sleep(...); }
      - pattern-not-inside: while ($C) { ... await delay(...); }
      - pattern-not-inside: while ($C) { ... await setTimeout(...); }
      - pattern-not-inside: do { ... break; } while ($C)
      - pattern-not-inside: do { ... return $R; } while ($C)
      - pattern-not-inside: do { ... return; } while ($C)
      - pattern-not-inside: while (<... $V ...>) { ... $V = $X; ... }
      - pattern-not-inside: do { ... $V = $X; ... } while (<... $V ...>)
  - id: await-in-loop-dart
    languages: [dart]
    severity: ERROR
    message: >-
      Each loop pass waits for the last one. Start independent calls together with Future.wait.
      A loop passes when it stops early (break or return), reads a value it updates in its condition, or sleeps on purpose.
    paths: *paths
    patterns:
      - pattern-either:
          - pattern-inside: for ($I in $C) { ... }
          - pattern-inside: for (...; ...; ...) { ... }
          - pattern-inside: while ($C) { ... }
          - pattern-inside: do { ... } while ($C);
      - pattern: await $E
      - pattern-not-inside: for ($I in $C) { ... break; }
      - pattern-not-inside: for ($I in $C) { ... return; }
      - pattern-not-inside: for ($I in $C) { ... return $R; }
      - pattern-not-inside: for ($I in $C) { ... await Future.delayed(...); }
      - pattern-not-inside: for (...; ...; ...) { ... break; }
      - pattern-not-inside: for (...; ...; ...) { ... return; }
      - pattern-not-inside: for (...; ...; ...) { ... return $R; }
      - pattern-not-inside: for (...; ...; ...) { ... await Future.delayed(...); }
      - pattern-not-inside: while ($C) { ... break; }
      - pattern-not-inside: while ($C) { ... return; }
      - pattern-not-inside: while ($C) { ... return $R; }
      - pattern-not-inside: while ($C) { ... await Future.delayed(...); }
      - pattern-not-inside: do { ... break; } while ($C);
      - pattern-not-inside: do { ... return; } while ($C);
      - pattern-not-inside: do { ... return $R; } while ($C);
      - pattern-not-inside: while (<... $V ...>) { ... $V = $X; ... }
      - pattern-not-inside: do { ... $V = $X; ... } while (<... $V ...>);
  - id: await-in-loop-swift
    languages: [swift]
    severity: ERROR
    message: >-
      Each loop pass waits for the last one. Start independent calls together with async let or a task group.
      A loop passes when it stops early (break or return), reads a value it updates in its condition, or sleeps on purpose.
    paths: *paths
    patterns:
      - pattern-either:
          - pattern-inside: for $I in $C { ... }
          - pattern-inside: while $C { ... }
          - pattern-inside: repeat { ... } while $C
      - pattern: await $E
      - pattern-not-inside: |
          for $I in $C {
            ...
            break
          }
      - pattern-not-inside: |
          for $I in $C {
            ...
            return $R
          }
      - pattern-not-inside: |
          for $I in $C {
            ...
            return
          }
      - pattern-not-inside: |
          for $I in $C {
            ...
            try await Task.sleep(...)
          }
      - pattern-not-inside: |
          while $C {
            ...
            break
          }
      - pattern-not-inside: |
          while $C {
            ...
            return $R
          }
      - pattern-not-inside: |
          while $C {
            ...
            return
          }
      - pattern-not-inside: |
          while $C {
            ...
            try await Task.sleep(...)
          }
      - pattern-not-inside: |
          while $C {
            ...
            $V = $X
          }
      - pattern-not-inside: |
          repeat {
            ...
            $V = $X
          } while $C
  - id: sequential-awaits-javascript
    languages: [javascript, typescript]
    severity: ERROR
    message: The second call does not use the first result. Start both together with Promise.all.
    paths: *paths
    patterns:
      - pattern-either:
          - pattern: |
              const $A = await $X;
              const $B = await $Y;
          - pattern: |
              let $A = await $X;
              let $B = await $Y;
      - pattern-not: |
          const $A = await $X;
          const $B = await <... $A ...>;
      - pattern-not: |
          let $A = await $X;
          let $B = await <... $A ...>;
  - id: sequential-awaits-python
    languages: [python]
    severity: ERROR
    message: The second call does not use the first result. Start both together with asyncio.gather.
    paths: *paths
    patterns:
      - pattern: |
          $A = await $X
          $B = await $Y
      - pattern-not: |
          $A = await $X
          $B = await <... $A ...>
  - id: sequential-awaits-dart
    languages: [dart]
    severity: ERROR
    message: The second call does not use the first result. Start both together with Future.wait or a record's .wait.
    paths: *paths
    pattern-regex: (?m)^[ \t]*(?:final|var|[A-Z]\w*(?:<[^=;\n]*>)?\??)\s+(\w+)\s*=\s*await\b[^;]*;[ \t]*\n[ \t]*(?:final|var|[A-Z]\w*(?:<[^=;\n]*>)?\??)\s+\w+\s*=\s*await\b(?:(?!\b\1\b)[^;])*;
  - id: sequential-awaits-swift
    languages: [swift]
    severity: ERROR
    message: The second call does not use the first result. Start both together with async let.
    paths: *paths
    patterns:
      - pattern-either:
          - pattern: |
              let $A = try await $X
              let $B = try await $Y
          - pattern: |
              let $A = await $X
              let $B = await $Y
      - pattern-not: |
          let $A = try await $X
          let $B = try await <... $A ...>
      - pattern-not: |
          let $A = await $X
          let $B = await <... $A ...>
  - id: url-parse-in-loop-javascript
    languages: [javascript, typescript]
    severity: ERROR
    message: This parses the same URL on every pass. Parse it once before the loop, or compare the strings directly.
    paths: *paths
    patterns:
      - pattern-either:
          - patterns:
              - pattern-inside: for (const $I of $C) { ... }
              - pattern: new URL(...)
              - pattern-not: new URL(<... $I ...>, ...)
          - patterns:
              - pattern-inside: for (let $I of $C) { ... }
              - pattern: new URL(...)
              - pattern-not: new URL(<... $I ...>, ...)
          - patterns:
              - pattern-inside: for (const $I in $C) { ... }
              - pattern: new URL(...)
              - pattern-not: new URL(<... $I ...>, ...)
          - patterns:
              - pattern-inside: for (let $I in $C) { ... }
              - pattern: new URL(...)
              - pattern-not: new URL(<... $I ...>, ...)
          - patterns:
              - pattern-inside: for (let $I = $S; $T; $U) { ... }
              - pattern: new URL(...)
              - pattern-not: new URL(<... $I ...>, ...)
          - patterns:
              - pattern-inside: $XS.$M(($I, ...) => $B)
              - pattern: new URL(...)
              - pattern-not: new URL(<... $I ...>, ...)
          - patterns:
              - pattern-inside: $XS.$M(function ($I, ...) { ... })
              - pattern: new URL(...)
              - pattern-not: new URL(<... $I ...>, ...)
          - patterns:
              - pattern-inside: while ($C) { ... }
              - pattern: new URL(...)
      - pattern-not-inside: for (...) { ... $V = $X; ... <... new URL(<... $V ...>, ...) ...>; }
      - pattern-not-inside: for (...) { ... const $V = $X; ... <... new URL(<... $V ...>, ...) ...>; }
      - pattern-not-inside: for (...) { ... let $V = $X; ... <... new URL(<... $V ...>, ...) ...>; }
      - pattern-not-inside: "$XS.$M(($I, ...) => { ... const $V = $X; ... <... new URL(<... $V ...>, ...) ...>; })"
  - id: url-parse-in-loop-python
    languages: [python]
    severity: ERROR
    message: This parses the same URL on every pass. Parse it once before the loop, or compare the strings directly.
    paths: *paths
    patterns:
      - pattern-either:
          - pattern-inside: |
              for $I in $Y:
                ...
          - pattern-inside: "[$E for $I in $Y]"
      - pattern-either:
          - pattern: urllib.parse.urlparse(...)
          - pattern: urllib.parse.urlsplit(...)
      - pattern-not: urllib.parse.urlparse(<... $I ...>, ...)
      - pattern-not: urllib.parse.urlsplit(<... $I ...>, ...)
      - pattern-not-inside: |
          for $I in $Y:
            ...
            $V = $X
            ...
            <... urllib.parse.urlparse(<... $V ...>, ...) ...>
      - pattern-not-inside: |
          for $I in $Y:
            ...
            $V = $X
            ...
            <... urllib.parse.urlsplit(<... $V ...>, ...) ...>
  - id: json-column
    languages: [generic]
    severity: ERROR
    message: A JSON column, or a read of one key from it. Store each key as a real column, or a list as a child table.
    paths:
      include: ["*.sql", "*.prisma"]
    patterns:
      - pattern-regex: (?i)\bjsonb?\b|->>|#>>
      - pattern-not-regex: (?m)(?:--|//).*$
      - pattern-not-regex: (?s)/\*.*?\*/
  - id: json-column-python
    languages: [python]
    options:
      constant_propagation: false
    severity: ERROR
    message: A JSON column, or a read of one key from it. Store each key as a real column, or a list as a child table.
    paths: *paths
    pattern-either:
      - pattern: JSONField(...)
      - pattern: $M.JSONField(...)
      - pattern: sqlalchemy.JSON
      - pattern: sqlalchemy.dialects.postgresql.JSONB
      - patterns:
          - pattern-either:
              - pattern-inside: $F(...)
              - pattern-inside: $X = $E
              - pattern-inside: return $E
          - pattern: '"$SQL"'
          - metavariable-regex: &json-read
              metavariable: $SQL
              regex: (?is)^.*?(?:\bjsonb\b|->>|#>>)
  - id: json-column-javascript
    languages: [javascript, typescript]
    options:
      constant_propagation: false
    severity: ERROR
    message: A JSON column, or a read of one key from it. Store each key as a real column, or a list as a child table.
    paths: *paths
    pattern-either:
      - pattern: jsonb(...)
      - pattern: $M.jsonb(...)
      - patterns:
          - pattern: '"$SQL"'
          - metavariable-regex: *json-read
  - id: json-column-swift
    languages: [swift]
    options:
      constant_propagation: false
    severity: ERROR
    message: A JSON column, or a read of one key from it. Store each key as a real column, or a list as a child table.
    paths: *paths
    patterns:
      - pattern: '"$SQL"'
      - metavariable-regex: *json-read
  - id: json-column-dart
    languages: [dart]
    severity: ERROR
    message: A JSON column, or a read of one key from it. Store each key as a real column, or a list as a child table.
    paths: *paths
    patterns:
      - pattern-regex: (?im)^(?:(?!//)[^\n'"])*(?:(?:'[^'\n]*'|"[^"\n]*")(?:(?!//)[^\n'"])*)*['"][^'"\n]*?(?:\bjsonb\b|->>|#>>)
      - pattern-not-regex: (?s)/\*.*?\*/
  - id: whole-entity-load-python
    languages: [python]
    severity: ERROR
    message: This loads every column. Read only the fields this code needs (.only(), .values(), load_only() or a column select).
    paths: *paths
    patterns:
      - pattern-either:
          - patterns:
              - pattern: $M.objects.$F(...)
              - metavariable-regex:
                  metavariable: $F
                  regex: ^(get|filter|all|exclude|first|last)$
              - pattern-not-inside: $M.objects.$F(...).$G(...)
          - patterns:
              - pattern: sqlalchemy.select($M)
              - metavariable-regex:
                  metavariable: $M
                  regex: ^[A-Z][a-z]\w*$
          - patterns:
              - pattern-either:
                  - pattern: $S.get($M, ...)
                  - pattern: $S.query($M)
              - metavariable-regex:
                  metavariable: $M
                  regex: ^[A-Z][a-z]\w*$
              - metavariable-regex:
                  metavariable: $S
                  regex: (?i)^(?:[\w.]*session|(?:[\w.]*\.)?db)$
