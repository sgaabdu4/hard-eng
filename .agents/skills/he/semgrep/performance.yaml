                  - pattern: urllib.parse.urlsplit(...)
              - pattern-not: urllib.parse.urlparse(<... $I ...>, ...)
              - pattern-not: urllib.parse.urlsplit(<... $I ...>, ...)
              - pattern-not-inside: |
                  for ($A, $B) in $Z:
                    ...

          - patterns:
              - pattern-inside: "[$E for $I in $Y]"
              - pattern-either:
                  - pattern: urllib.parse.urlparse(...)
                  - pattern: urllib.parse.urlsplit(...)
              - pattern-not: urllib.parse.urlparse(<... $I ...>, ...)
              - pattern-not: urllib.parse.urlsplit(<... $I ...>, ...)
              - pattern-not-inside: "[$F for ($A, $B) in $Z]"
          - patterns:
              - pattern-inside: |
                  for ($K, $V) in $Y:
                    ...

              - pattern-either:
                  - pattern: urllib.parse.urlparse(...)
                  - pattern: urllib.parse.urlsplit(...)
              - pattern-not: urllib.parse.urlparse(<... $K ...>, ...)
              - pattern-not: urllib.parse.urlsplit(<... $K ...>, ...)
              - pattern-not: urllib.parse.urlparse(<... $V ...>, ...)
              - pattern-not: urllib.parse.urlsplit(<... $V ...>, ...)
          - patterns:
