name: Check skill contracts

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install pinned repository checks
        run: npm ci --ignore-scripts

      - name: Resolve Fallow comparison base
        id: fallow-base
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE"
          elif [[ -n "$PUSH_BEFORE" && ! "$PUSH_BEFORE" =~ ^0+$ ]]; then
            base="$PUSH_BEFORE"
          elif git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            base="HEAD^"
          else
            base="HEAD"
          fi
          printf 'base=%s\n' "$base" >> "$GITHUB_OUTPUT"

      - name: Run JavaScript quality gates
        env:
          FALLOW_AUDIT_BASE: ${{ steps.fallow-base.outputs.base }}
        run: python3 skills/deterministic-checks/scripts/project_gate.py run --repo . --timeout 240 --family typecheck --family format --family lint --family tests --family fallow

      - name: Check skill contracts
        run: python3 skills/deterministic-checks/scripts/bounded_run.py --timeout 240 -- python3 scripts/check-skill-contracts.py

      - name: Check DESIGN.md
        run: python3 skills/deterministic-checks/scripts/bounded_run.py --timeout 120 --cwd . -- node skills/deterministic-checks/scripts/check-design-md.js "$GITHUB_WORKSPACE/DESIGN.md"

      - name: Check managed skills
        run: python3 skills/deterministic-checks/scripts/bounded_run.py --timeout 120 --cwd . -- node scripts/check-managed-skills.js
