name: A3 measure

on:
  pull_request:

permissions:
  contents: read

jobs:
  measure:
    name: ${{ matrix.label }} round ${{ matrix.round }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        label: [auto, n8, auto-worksteal, n8-worksteal]
        round: [1, 2, 3]
        include:
          - label: auto
            args: -n auto
          - label: n8
            args: -n 8
          - label: auto-worksteal
            args: -n auto --dist worksteal
          - label: n8-worksteal
            args: -n 8 --dist worksteal
    env:
      MISE_FETCH_REMOTE_VERSIONS_CACHE: 0s
      MISE_PREFER_OFFLINE: 'false'
      MISE_USE_VERSIONS_HOST: 'false'
      MISE_MINIMUM_RELEASE_AGE: 2d
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
      - name: Measure
        env:
          LABEL: ${{ matrix.label }}
          ARGS: ${{ matrix.args }}
        run: |
          export MISE_DATA_DIR="$RUNNER_TEMP/m/data" MISE_CACHE_DIR="$RUNNER_TEMP/m/cache" MISE_STATE_DIR="$RUNNER_TEMP/m/state" BUN_INSTALL_CACHE_DIR="$RUNNER_TEMP/m/bun"
          package="@jdxcode/mise-linux-x64@latest"
          tools=(uv@latest python@3.12 dart@latest)
          bun x --package="$package" mise --no-config install "${tools[@]}"
          read -r -a args <<< "$ARGS"
          bun x --package="$package" mise --no-config exec "${tools[@]}" -- bash a3-measure.sh "$LABEL" "${args[@]}"
