name: Hard Eng

on:
  push:
    branches-ignore:
      - 'feature/**'
  pull_request:

permissions:
  contents: read
  checks: read # Verify the upstream release for scaffold-only updates.

concurrency:
  group: hard-eng-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hard-eng:
    name: hard-eng
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - name: Cache native tool downloads
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/hard-eng-tools
          key: ${{ runner.os }}-${{ runner.arch }}-hard-eng-tools-${{ hashFiles('.github/workflows/hard-eng.yml', '.hooks/tool_setup.py', 'hard-eng.gates.json') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-hard-eng-tools-
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          version: latest
          runtime: node@latest
          install: false
      - name: Run required checks
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          MISE_DATA_DIR: ${{ runner.temp }}/hard-eng-tools/mise/data
          MISE_CACHE_DIR: ${{ runner.temp }}/hard-eng-tools/mise/cache
          MISE_STATE_DIR: ${{ runner.temp }}/hard-eng-tools/mise/state
          PNPM_CONFIG_STORE_DIR: ${{ runner.temp }}/hard-eng-tools/pnpm/store
          PNPM_CONFIG_CACHE_DIR: ${{ runner.temp }}/hard-eng-tools/pnpm/cache
          MISE_FETCH_REMOTE_VERSIONS_CACHE: 0s
          MISE_PREFER_OFFLINE: 'false'
          MISE_USE_VERSIONS_HOST: 'false'
          MISE_MINIMUM_RELEASE_AGE: 0s
        run: |
          pnpm dlx --allow-build=@jdxcode/mise --package=@jdxcode/mise@latest mise --no-config install uv@latest python@3.12 node@latest dart@latest &&
          MISE_FETCH_REMOTE_VERSIONS_CACHE=1h pnpm dlx --allow-build=@jdxcode/mise --package=@jdxcode/mise@latest mise --no-config exec uv@latest python@3.12 node@latest dart@latest -- uv run --no-project --with pyyaml python .hooks/hard-eng.py check --base "$BASE_SHA"
