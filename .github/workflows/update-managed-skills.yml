name: Update managed skills

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-managed-skills
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26

      - name: Check mutation readiness
        run: python3 skills/deterministic-checks/scripts/worktree.py --repo . --intent write

      - name: Install pinned repository checks
        run: npm ci --ignore-scripts

      - name: Map checkout to the global agents home
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/managed-skills-home"
          ln -s "$GITHUB_WORKSPACE" "$RUNNER_TEMP/managed-skills-home/.agents"

      - name: Update every locked skill
        env:
          HOME: ${{ runner.temp }}/managed-skills-home
        run: ./scripts/update-managed-skills.sh --ci

      - name: Validate and commit updates
        shell: bash
        run: |
          git status --short
          git add -- .skill-lock.json skills
          git diff --cached --check
          if git diff --cached --quiet; then
            exit 0
          fi
          export ROOT="$PWD"
          . scripts/setup/common.sh
          . scripts/setup/binaries.sh
          install_binary ruff
          install_binary gitleaks
          export PATH="$HOME/.local/bin:$PATH"
          python3 skills/deterministic-checks/scripts/bounded_run.py --timeout 180 -- sudo apt-get update
          command -v fish >/dev/null || python3 skills/deterministic-checks/scripts/bounded_run.py --timeout 180 -- sudo apt-get install -y fish zsh
          command -v ffmpeg >/dev/null || python3 skills/deterministic-checks/scripts/bounded_run.py --timeout 300 -- sudo apt-get install -y ffmpeg
          npm ci --ignore-scripts --prefix skills/product-walkthrough-video
          python3 skills/deterministic-checks/scripts/bounded_run.py --timeout 300 -- skills/product-walkthrough-video/node_modules/.bin/playwright install --with-deps chromium
          ./scripts/git-hooks/publish-gate.sh push
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update managed skills"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          git push --dry-run origin "HEAD:${{ github.event.repository.default_branch }}"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"
